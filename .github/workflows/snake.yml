# ============================================================
# SETUP INSTRUCTIONS FOR THE SNAKE ANIMATION
# ============================================================
# 1. Create a new repo named EXACTLY your GitHub username
#    (e.g. if your username is "rithik-dev", repo = "rithik-dev/rithik-dev").
#    This special repo is what powers your profile README.
# 2. Put README.md in that repo's root.
# 3. Create the folder .github/workflows/ in the same repo.
# 4. Save this file there as .github/workflows/snake.yml
# 5. Push to GitHub — the workflow runs on a schedule and on push,
#    builds the snake SVG, and commits it to an "output" branch.
# 6. The <img> tag in README.md already points to that output branch.
# ============================================================

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  push:
    branches:
      - main
  workflow_dispatch: {}

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push SVG to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
